  <script>
    (() => {
      const root = document.documentElement;
      root.classList.add('is-loading');
      window.EKO_PAGE_READY = new Promise(resolve => {
        let finished = false;
        window.ekoFinishLoading = () => {
          if (finished) return;
          finished = true;
          clearTimeout(window.ekoLoadingTimeout);
          root.classList.remove('is-loading');
          document.getElementById('main')?.removeAttribute('aria-busy');
          const overlay = document.getElementById('site-loader');
          overlay?.classList.add('is-complete');
          setTimeout(() => overlay?.remove(), 360);
          resolve();
        };
        window.ekoLoadingTimeout = setTimeout(window.ekoFinishLoading, 20000);
      });
    })();
  </script>
